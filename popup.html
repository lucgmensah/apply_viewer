<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Apply View</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="popup-header">
    <div class="brand">
      <span class="logo-dot" aria-hidden="true"></span>
      <span>Apply View</span>
    </div>
    <div class="header-actions">
      <button type="button" id="btn-add" class="icon-btn" aria-label="Ajouter une candidature" title="Ajouter une candidature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" id="btn-dashboard" class="icon-btn" aria-label="Ouvrir le tableau de bord" title="Ouvrir le tableau de bord">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </button>
    </div>
  </header>

  <main class="popup-main">

    <!-- VUE LISTE -->
    <section id="view-list" class="view">
      <div id="banner" class="hidden"></div>

      <div class="segmented" role="tablist" aria-label="Filtrer par avancement"></div>

      <div class="list-toolbar">
        <span id="list-count" class="list-count"></span>
        <button type="button" id="search-toggle" class="icon-btn icon-btn--sm" aria-label="Rechercher" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </div>
      <input type="search" id="search-input" class="input hidden" placeholder="Poste, entreprise, lieu…" aria-label="Rechercher une candidature">

      <div id="job-list" class="job-list" role="tabpanel"></div>
    </section>

    <!-- VUE DÉTAIL -->
    <section id="view-detail" class="view hidden"></section>

    <!-- VUE AJOUT -->
    <section id="view-add" class="view hidden"></section>

  </main>

  <script src="shared.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
